name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Expo CLI
        run: npm install -g @expo/cli@latest

      - name: Install dependencies
        working-directory: cyberlinkhr/mobile
        run: npm install --legacy-peer-deps

      - name: Generate Keystore
        working-directory: cyberlinkhr/mobile
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=CyberlinkHR, OU=Mobile, O=Cyberlink, L=Mumbai, S=Maharashtra, C=IN"

      - name: Create .env
        working-directory: cyberlinkhr/mobile
        run: |
          echo "EXPO_PUBLIC_API_URL=https://hrms.cyberlink.co.in" > .env

      - name: Expo Prebuild
        working-directory: cyberlinkhr/mobile
        run: npx expo prebuild --clean --no-install --platform android

      - name: Patch Kotlin version (expo-modules-core fix)
        working-directory: cyberlinkhr/mobile/android
        run: |
          # Pin Kotlin to 1.9.24 — required for expo-modules-core on Expo SDK 52
          if grep -q 'kotlinVersion' gradle.properties; then
            sed -i 's/kotlinVersion=.*/kotlinVersion=1.9.24/' gradle.properties
          else
            echo 'kotlinVersion=1.9.24' >> gradle.properties
          fi
          echo 'org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m' >> gradle.properties
          echo 'android.useAndroidX=true' >> gradle.properties
          echo 'android.enableJetifier=true' >> gradle.properties
          cat gradle.properties

      - name: Configure signing
        working-directory: cyberlinkhr/mobile/android
        run: |
          cat >> gradle.properties << 'EOF'
          MYAPP_RELEASE_STORE_FILE=../release.keystore
          MYAPP_RELEASE_KEY_ALIAS=release
          MYAPP_RELEASE_STORE_PASSWORD=android
          MYAPP_RELEASE_KEY_PASSWORD=android
          EOF

          # Patch app/build.gradle to use our keystore
          sed -i 's/signingConfigs {/signingConfigs {\n        release {\n            storeFile file(MYAPP_RELEASE_STORE_FILE)\n            storePassword MYAPP_RELEASE_STORE_PASSWORD\n            keyAlias MYAPP_RELEASE_KEY_ALIAS\n            keyPassword MYAPP_RELEASE_KEY_PASSWORD\n        }/' app/build.gradle || true
          sed -i 's/signingConfig signingConfigs.debug/signingConfig signingConfigs.release/' app/build.gradle || true

      - name: Build APK
        working-directory: cyberlinkhr/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1

      - name: Find APK
        id: find_apk
        run: |
          APK=$(find cyberlinkhr/mobile/android -name "*.apk" -path "*/release/*" | head -1)
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          echo "Found APK: $APK"

      - name: Rename APK
        run: |
          cp "${{ steps.find_apk.outputs.apk_path }}" cyberlinkhr-hr-employee.apk
          ls -lh cyberlinkhr-hr-employee.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyberlinkHR-Employee-APK
          path: cyberlinkhr-hr-employee.apk
          retention-days: 30

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: apk-${{ github.run_number }}-${{ github.sha }}
          release_name: "CyberlinkHR Employee APK (build #${{ github.run_number }})"
          body: |
            ## CyberlinkHR Employee APK
            **Build:** #${{ github.run_number }}
            **Commit:** ${{ github.sha }}
            **Date:** ${{ github.event.head_commit.timestamp }}

            ### Changes
            ${{ github.event.head_commit.message }}
          draft: false
          prerelease: false

      - name: Upload APK to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: cyberlinkhr-hr-employee.apk
          asset_name: CyberlinkHR-Employee.apk
          asset_content_type: application/vnd.android.package-archive
