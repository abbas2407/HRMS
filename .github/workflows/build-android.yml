name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        working-directory: cyberlinkhr/mobile
        run: npm install

      - name: Set versionCode to run number
        working-directory: cyberlinkhr/mobile
        run: |
          python3 -c "
          import json
          with open('app.json', 'r') as f:
              cfg = json.load(f)
          cfg['expo']['android']['versionCode'] = ${{ github.run_number }}
          with open('app.json', 'w') as f:
              json.dump(cfg, f, indent=2)
          print('versionCode set to ${{ github.run_number }}')
          "

      - name: Expo prebuild
        working-directory: cyberlinkhr/mobile
        run: npx expo prebuild --clean --no-install

      - name: Force Kotlin 1.9.25 (safety net)
        working-directory: cyberlinkhr/mobile
        run: |
          sed -i 's/kotlinVersion = "1\.9\.24"/kotlinVersion = "1.9.25"/g' android/build.gradle
          sed -i "s/kotlinVersion = '1\.9\.24'/kotlinVersion = '1.9.25'/g" android/build.gradle
          sed -i '/^kotlin\.version=/d' android/gradle.properties 2>/dev/null || true
          echo "kotlin.version=1.9.25" >> android/gradle.properties

      - name: Fix gradlew permissions
        working-directory: cyberlinkhr/mobile
        run: chmod +x android/gradlew

      # ── Keystore: restore from secret if available, else generate once ──
      - name: Restore or generate keystore
        working-directory: cyberlinkhr/mobile/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using keystore from secret"
            echo "$KEYSTORE_BASE64" | base64 -d > cyberlink-release.keystore
          else
            echo "No secret found — generating new keystore"
            keytool -genkeypair -v \
              -keystore cyberlink-release.keystore \
              -alias cyberlink \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=CyberlinkHR,OU=Mobile,O=Cyberlink Technologies,L=Mumbai,S=Maharashtra,C=IN" \
              -storepass cyberlinkhr2024 \
              -keypass cyberlinkhr2024
            # Save base64 to artifact so you can grab it once and add as secret
            base64 cyberlink-release.keystore > keystore-base64.txt
            echo ""
            echo "=========================================================="
            echo "ACTION REQUIRED: Copy the content of keystore-base64.txt"
            echo "and add it as GitHub secret ANDROID_KEYSTORE_BASE64."
            echo "This ensures the same signing key is used every build."
            echo "=========================================================="
          fi

      - name: Upload keystore base64 (grab this once, add as secret ANDROID_KEYSTORE_BASE64)
        uses: actions/upload-artifact@v4
        with:
          name: keystore-base64
          path: cyberlinkhr/mobile/android/keystore-base64.txt
          retention-days: 7
        continue-on-error: true

      - name: Build release APK
        working-directory: cyberlinkhr/mobile/android
        env:
          EXPO_PUBLIC_API_URL: https://hrms.cyberlink.co.in
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/cyberlinkhr/mobile/android/cyberlink-release.keystore \
            -Pandroid.injected.signing.store.password=cyberlinkhr2024 \
            -Pandroid.injected.signing.key.alias=cyberlink \
            -Pandroid.injected.signing.key.password=cyberlinkhr2024

      - name: Show Gradle build log on failure
        if: failure()
        working-directory: cyberlinkhr/mobile/android
        run: |
          find . -name "*.log" 2>/dev/null | head -3 | while read f; do
            echo "=== $f ==="; tail -100 "$f"
          done || true

      - name: Find and rename APK
        id: apk
        run: |
          APK=$(find cyberlinkhr/mobile/android/app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "Found: $APK"
          cp "$APK" CyberlinkHR-v1.0.${{ github.run_number }}.apk
          echo "file=CyberlinkHR-v1.0.${{ github.run_number }}.apk" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyberlinkHR-APK-v1.0.${{ github.run_number }}
          path: ${{ steps.apk.outputs.file }}
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "CyberlinkHR Employee v1.0.${{ github.run_number }}"
          body: |
            ## CyberlinkHR Employee App
            **Built from commit:** ${{ github.sha }}
            **Version code:** ${{ github.run_number }}

            ### Install
            1. Download `CyberlinkHR-v1.0.${{ github.run_number }}.apk` below
            2. Enable "Install from unknown sources" on your Android phone
            3. Open the APK to install
          files: ${{ steps.apk.outputs.file }}
          draft: false
          prerelease: false
