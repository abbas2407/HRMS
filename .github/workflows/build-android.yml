name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version_suffix:
        description: 'Optional version suffix (e.g. beta, hotfix)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cyberlinkhr/mobile/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install mobile dependencies
        working-directory: cyberlinkhr/mobile
        run: npm ci

      - name: Expo prebuild (generate Android project)
        working-directory: cyberlinkhr/mobile
        env:
          EXPO_NO_TELEMETRY: 1
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build debug APK
        working-directory: cyberlinkhr/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        id: apk
        run: |
          SUFFIX="${{ github.event.inputs.version_suffix }}"
          TAG="v1.0.${{ github.run_number }}${SUFFIX:+-$SUFFIX}"
          APK_NAME="CyberlinkHR-${TAG}.apk"
          cp cyberlinkhr/mobile/android/app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          echo "apk_name=$APK_NAME" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.apk_name }}
          path: ${{ steps.apk.outputs.apk_name }}
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          name: "CyberlinkHR ${{ steps.apk.outputs.tag }}"
          body: |
            ## CyberlinkHR Mobile APK

            Built from commit `${{ github.sha }}` on branch `${{ github.ref_name }}`.

            ### How to install
            1. Download **${{ steps.apk.outputs.apk_name }}** below
            2. On your Android phone, go to **Settings → Install unknown apps** and allow your browser or file manager
            3. Open the downloaded APK and tap **Install**

            > This is a debug-signed build for internal testing.
          files: ${{ steps.apk.outputs.apk_name }}
          draft: false
          prerelease: false
