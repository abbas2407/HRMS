name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        working-directory: cyberlinkhr/mobile
        # npm install (not ci) — works with or without package-lock.json
        run: npm install

      - name: Expo prebuild
        working-directory: cyberlinkhr/mobile
        run: npx expo prebuild --clean --no-install

      - name: Force Kotlin 1.9.25 (safety net)
        working-directory: cyberlinkhr/mobile
        run: |
          echo "=== Kotlin version BEFORE patch ==="
          grep -n "kotlinVersion\|kotlin_version\|kotlin\.version" android/build.gradle android/gradle.properties 2>/dev/null || true
          # Directly replace the kotlinVersion var in the root build.gradle
          sed -i 's/kotlinVersion = "1\.9\.24"/kotlinVersion = "1.9.25"/g' android/build.gradle
          sed -i "s/kotlinVersion = '1\.9\.24'/kotlinVersion = '1.9.25'/g" android/build.gradle
          # Stamp kotlin.version into gradle.properties (respected by Kotlin Gradle plugin)
          sed -i '/^kotlin\.version=/d' android/gradle.properties 2>/dev/null || true
          echo "kotlin.version=1.9.25" >> android/gradle.properties
          echo "=== Kotlin version AFTER patch ==="
          grep -n "kotlinVersion\|kotlin_version\|kotlin\.version" android/build.gradle android/gradle.properties 2>/dev/null || true

      # ── gradlew is generated without +x on Linux ────────────────────────
      - name: Fix gradlew permissions
        working-directory: cyberlinkhr/mobile
        run: chmod +x android/gradlew

      - name: Generate release keystore
        working-directory: cyberlinkhr/mobile/android
        run: |
          keytool -genkeypair -v \
            -keystore cyberlink-release.keystore \
            -alias cyberlink \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=CyberlinkHR,OU=Mobile,O=Cyberlink Technologies,L=Mumbai,S=Maharashtra,C=IN" \
            -storepass cyberlinkhr2024 \
            -keypass cyberlinkhr2024

      - name: Build release APK
        working-directory: cyberlinkhr/mobile/android
        env:
          EXPO_PUBLIC_API_URL: https://hrms.cyberlink.co.in
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/cyberlinkhr/mobile/android/cyberlink-release.keystore \
            -Pandroid.injected.signing.store.password=cyberlinkhr2024 \
            -Pandroid.injected.signing.key.alias=cyberlink \
            -Pandroid.injected.signing.key.password=cyberlinkhr2024

      - name: Show Gradle build log on failure
        if: failure()
        working-directory: cyberlinkhr/mobile/android
        run: |
          LOG=$(find . -path "*/build/outputs/logs/*.log" -o -name "*.log" 2>/dev/null | head -3)
          for f in $LOG; do echo "=== $f ==="; tail -100 "$f"; done || true

      - name: Find APK
        id: apk
        run: |
          APK=$(find cyberlinkhr/mobile/android/app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "Found: $APK"
          cp "$APK" CyberlinkHR-Employee-v1.0.${{ github.run_number }}.apk
          echo "file=CyberlinkHR-Employee-v1.0.${{ github.run_number }}.apk" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyberlinkHR-Employee-APK
          path: ${{ steps.apk.outputs.file }}
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "CyberlinkHR Employee v1.0.${{ github.run_number }}"
          body: |
            ## CyberlinkHR Employee App
            **Built from:** ${{ github.sha }}

            ### Install
            1. Download the APK below
            2. Enable "Install from unknown sources" on your Android phone
            3. Open the APK to install
          files: ${{ steps.apk.outputs.file }}
          draft: false
          prerelease: false
