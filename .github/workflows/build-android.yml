name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version_suffix:
        description: 'Optional version suffix (e.g. beta, hotfix)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cyberlinkhr/mobile/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install mobile dependencies
        working-directory: cyberlinkhr/mobile
        run: npm ci

      - name: Expo prebuild (generate Android project)
        working-directory: cyberlinkhr/mobile
        env:
          EXPO_NO_TELEMETRY: 1
        run: npx expo prebuild --platform android --clean --no-install

      # Fix 1 — bundle the JS into the APK so it works without Metro
      # Fix 2 — split by CPU so each APK is ~half the size
      - name: Patch gradle.properties
        working-directory: cyberlinkhr/mobile/android
        run: |
          echo "" >> gradle.properties
          echo "# Bundle JS into debug APK (no Metro required)" >> gradle.properties
          echo "bundleInDebug=true" >> gradle.properties
          echo "" >> gradle.properties
          echo "# Split per CPU arch to cut APK size in half" >> gradle.properties
          echo "enableSeparateBuildPerCPUArchitecture=true" >> gradle.properties

      - name: Build APK
        working-directory: cyberlinkhr/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Pick arm64 APK and set outputs
        id: apk
        run: |
          SUFFIX="${{ github.event.inputs.version_suffix }}"
          TAG="v1.0.${{ github.run_number }}${SUFFIX:+-$SUFFIX}"
          APK_NAME="CyberlinkHR-${TAG}.apk"
          # arm64-v8a covers all modern Android phones (2017+)
          cp cyberlinkhr/mobile/android/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk "$APK_NAME"
          APK_SIZE=$(du -sh "$APK_NAME" | cut -f1)
          echo "apk_name=$APK_NAME" >> $GITHUB_OUTPUT
          echo "tag=$TAG"           >> $GITHUB_OUTPUT
          echo "apk_size=$APK_SIZE" >> $GITHUB_OUTPUT

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.apk_name }}
          path: ${{ steps.apk.outputs.apk_name }}
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          name: "CyberlinkHR ${{ steps.apk.outputs.tag }}"
          body: |
            ## CyberlinkHR Mobile APK

            Built from commit `${{ github.sha }}` on branch `${{ github.ref_name }}`.
            APK size: **${{ steps.apk.outputs.apk_size }}** (arm64, works on all modern Android phones)

            ### How to install
            1. Download **${{ steps.apk.outputs.apk_name }}** below
            2. On your Android phone → **Settings → Install unknown apps** → allow your browser/Files app
            3. Open the downloaded APK → tap **Install**

            ### Older phones (arm32)
            If install fails, download `app-armeabi-v7a-debug.apk` from the workflow artifacts instead.
          files: ${{ steps.apk.outputs.apk_name }}
          draft: false
          prerelease: false
