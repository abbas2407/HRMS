name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version_suffix:
        description: 'Optional version suffix (e.g. beta, hotfix)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cyberlinkhr/mobile/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        working-directory: cyberlinkhr/mobile
        run: npm ci

      - name: Expo prebuild
        working-directory: cyberlinkhr/mobile
        env:
          EXPO_NO_TELEMETRY: 1
        run: npx expo prebuild --platform android --clean --no-install

      # Release build always bundles JS automatically — no bundleInDebug needed
      # Also generates a CI-only keystore so the APK is installable
      - name: Generate release keystore
        working-directory: cyberlinkhr/mobile/android/app
        run: |
          keytool -genkeypair -v \
            -keystore release.jks \
            -alias cyberlinkhr \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android123 -keypass android123 \
            -dname "CN=CyberlinkHR,O=Cyberlink,C=IN"

      - name: Build release APK
        working-directory: cyberlinkhr/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$(pwd)/app/release.jks \
            -Pandroid.injected.signing.store.password=android123 \
            -Pandroid.injected.signing.key.alias=cyberlinkhr \
            -Pandroid.injected.signing.key.password=android123

      - name: Find APK and set outputs
        id: apk
        run: |
          SUFFIX="${{ github.event.inputs.version_suffix }}"
          TAG="v1.0.${{ github.run_number }}${SUFFIX:+-$SUFFIX}"
          APK_NAME="CyberlinkHR-${TAG}.apk"
          echo "=== Built APKs ==="
          find cyberlinkhr/mobile/android/app/build/outputs/apk/ -name "*.apk" || true
          SRC=$(find cyberlinkhr/mobile/android/app/build/outputs/apk/release/ -name "*.apk" | head -1)
          [ -z "$SRC" ] && SRC=$(find cyberlinkhr/mobile/android/app/build/outputs/apk/ -name "*.apk" | head -1)
          if [ -z "$SRC" ]; then echo "ERROR: no APK found" && exit 1; fi
          cp "$SRC" "$APK_NAME"
          APK_SIZE=$(du -sh "$APK_NAME" | cut -f1)
          echo "APK: $APK_NAME ($APK_SIZE)"
          echo "apk_name=$APK_NAME" >> $GITHUB_OUTPUT
          echo "tag=$TAG"           >> $GITHUB_OUTPUT
          echo "apk_size=$APK_SIZE" >> $GITHUB_OUTPUT

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.apk_name }}
          path: ${{ steps.apk.outputs.apk_name }}
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          name: "CyberlinkHR ${{ steps.apk.outputs.tag }}"
          body: |
            ## CyberlinkHR Mobile APK

            Commit `${{ github.sha }}` · Size: **${{ steps.apk.outputs.apk_size }}**

            ### Install on Android
            1. Download **${{ steps.apk.outputs.apk_name }}** below
            2. Settings → Security → **Install unknown apps** → allow your browser or Files app
            3. Open the APK → tap **Install**
          files: ${{ steps.apk.outputs.apk_name }}
          draft: false
          prerelease: false
